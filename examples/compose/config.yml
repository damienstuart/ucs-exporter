# Minimal configuration used by docker-compose.yaml. See ../config.yml for
# every option.
defaults:
  # username comes from $PROM_UCS_USERNAME
  password_file: /run/secrets/ucs_password
  tls:
    # Mount your UCSM CA certificate and set ca_file, or (less safely)
    # disable verification for self-signed certificates.
    insecure_skip_verify: false
domains:
  - name: ucs.example.com
