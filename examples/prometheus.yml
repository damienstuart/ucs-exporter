# Prometheus scrape configuration for ucs-exporter: one target per UCS
# domain, all scraped through the exporter.
global:
  scrape_interval: 60s

scrape_configs:
  - job_name: ucs
    scrape_interval: 60s   # match the exporter's poll interval
    scrape_timeout: 15s    # scrapes are served from memory
    metrics_path: /metrics
    static_configs:
      - targets:
          - ucs-lon1.example.com
          - ucs-nyc1
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_domain
      - source_labels: [__param_domain]
        target_label: instance
      - target_label: __address__
        replacement: ucs-exporter:3001

  # The exporter's own metrics (Go runtime, build info, reloads).
  - job_name: ucs-exporter
    static_configs:
      - targets: [ucs-exporter:3001]
